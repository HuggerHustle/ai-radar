<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📡 ai-radar</title>
  <!-- Set the theme before first paint so dark-mode users don't see a light flash. -->
  <script>
    document.documentElement.classList.toggle('dark',
      (localStorage.getItem('ar-theme') ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./app.css">
  <link rel="alternate" type="application/rss+xml" title="ai-radar RSS" href="./feed.xml">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body class="h-full overflow-hidden bg-background font-sans text-foreground antialiased max-md:overflow-auto">
<div id="app" class="flex h-screen flex-col max-md:h-auto max-md:min-h-screen">
  <header id="hdr" class="flex h-14 shrink-0 items-center justify-between border-b px-5 max-md:px-3">
    <div class="flex items-center gap-2.5 font-heading text-lg tracking-tight">
      <span class="animate-pulse" aria-hidden="true">📡</span>
      <span>ai-radar</span>
    </div>
    <div class="flex items-center gap-2.5 max-md:gap-1.5">
      <span class="size-1.5 animate-pulse rounded-full bg-success" aria-hidden="true"></span>
      <a class="inline-flex h-8 items-center justify-center rounded-full border px-2.5 text-muted-foreground transition-colors hover:border-brand hover:text-brand max-md:size-11" href="https://github.com/HuggerHustle/ai-radar" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
      <a id="rssLink" class="inline-flex h-8 items-center gap-1.5 rounded-full border px-3 text-label-sm uppercase text-muted-foreground transition-colors hover:border-brand hover:text-brand max-md:hidden" href="./feed.xml" title="RSS Feed"><span aria-hidden="true">⊕</span>RSS</a>
      <button id="themeBtn" type="button" title="Theme: system, light or dark" class="inline-flex h-8 cursor-pointer items-center gap-1.5 rounded-full border px-3 text-label-sm uppercase text-muted-foreground transition-colors hover:border-brand hover:text-brand max-md:h-11"><span class="hdr-icon max-md:hidden" aria-hidden="true">◐</span><span class="hdr-label">System</span></button>
    </div>
  </header>

  <div id="body" class="flex flex-1 overflow-hidden max-md:flex-col max-md:overflow-visible">
    <nav id="sidebar" aria-label="Reports" class="w-75 shrink-0 overflow-y-auto border-r py-2.5 [scrollbar-width:thin] max-md:max-h-12 max-md:w-full max-md:overflow-hidden max-md:border-r-0 max-md:border-b max-md:py-0 max-md:transition-[max-height] max-md:duration-300 max-md:[&.open]:max-h-[60vh] max-md:[&.open]:overflow-y-auto max-md:[&.open]:pb-2">
      <button id="mob-toggle" type="button" aria-expanded="false" aria-controls="sidebar" class="hidden h-12 w-full cursor-pointer items-center gap-2 border-b border-transparent px-4 text-label-md text-muted-foreground transition-colors hover:text-foreground in-[.open]:border-border max-md:flex">
        ☰ &nbsp;Select report
      </button>
      <div class="px-4 pt-1 pb-2.5 text-label-sm uppercase text-muted-foreground max-md:mt-2">Reports</div>
      <div class="px-3 pb-2.5">
        <input id="searchInput" type="search" aria-label="Search all reports" placeholder="Search all reports, e.g. Claude" class="h-8 w-full rounded-md border bg-background px-3 text-label-md placeholder:text-muted-foreground focus-visible:outline-offset-0 max-md:h-11">
        <div id="searchStatus" aria-live="polite" class="mt-1 min-h-4 text-body-sm text-muted-foreground"></div>
      </div>
      <div id="nav"></div>
    </nav>

    <main id="cwrap" class="flex-1 overflow-y-auto [scrollbar-width:thin] max-md:overflow-visible">
      <div id="content" class="mx-auto max-w-205 px-12 pt-9 pb-18 max-md:px-4 max-md:pt-5 max-md:pb-12">
        <div class="flex h-60 flex-col items-center justify-center gap-3 text-body-sm text-muted-foreground"><div class="text-4xl opacity-35">📡</div><div>Loading…</div></div>
      </div>
    </main>
  </div>
</div>

<script>
marked.use({ breaks: true, gfm: true });

// Allow <details> and <summary> which DOMPurify strips by default
DOMPurify.addHook('uponSanitizeElement', (node, data) => {
  if (data.tagName === 'details' || data.tagName === 'summary') {
    data.allowedTags[data.tagName] = true;
  }
});

function renderMarkdown(raw) {
  const html = marked.parse(raw);
  return DOMPurify.sanitize(html, {
    ADD_TAGS: ['details', 'summary'],
    ADD_ATTR: ['open'],
  });
}

const LABELS = {
  'ai-cli':       'AI CLI Tools',
  'ai-agents':    'AI Agents Ecosystem',
  'ai-infra':     'AI Infrastructure',
  'ai-web':       'OpenAI & Anthropic Updates',
  'ai-trending':  'GitHub AI Trends',
  'ai-hn':        'HN Community Digest',
  'ai-ph':        'Product Hunt AI',
  'ai-arxiv':     'ArXiv AI Research',
  'ai-hf':        'HF Trending Models',
  'ai-community': 'Tech Community AI',
  'ai-weekly':    'Weekly Report',
  'ai-monthly':   'Monthly Report',
};

// ── Tailwind class sets for JS-built elements (state is toggled via the
// `open` / `lit` / `active` / `search-hit` classes these variants read) ──
const CLS = {
  monthHdr: 'flex w-full cursor-pointer select-none items-center justify-between px-3.5 py-1.5 text-left text-label-sm uppercase text-muted-foreground transition-colors hover:text-foreground focus-visible:-outline-offset-3 [&.lit]:text-brand max-md:min-h-11',
  monthArr: 'inline-block text-label-lg transition-transform group-[.open]/month:rotate-90',
  monthBody: 'hidden group-[.open]/month:block',
  dateHdr: 'flex w-full cursor-pointer select-none items-center justify-between py-1.5 pr-3.5 pl-5.5 text-left text-label-md text-muted-foreground transition-colors hover:text-foreground focus-visible:-outline-offset-3 [&.lit]:text-brand [&.search-hit]:bg-accent [&.search-hit]:text-brand max-md:min-h-11',
  dateArr: 'inline-block text-label-lg transition-transform group-[.open]/date:rotate-90',
  rptList: 'hidden group-[.open]/date:block',
  rptBtn: 'block w-full cursor-pointer border-l-2 border-transparent py-1.5 pr-3.5 pl-6.5 text-left text-label-md text-muted-foreground transition-colors hover:bg-accent hover:text-foreground focus-visible:-outline-offset-3 [&.active]:border-brand [&.active]:bg-accent [&.active]:text-brand max-md:min-h-11',
  md: 'prose prose-tokens max-w-none font-sans transition-opacity duration-300 starting:opacity-0 prose-headings:font-heading prose-headings:font-medium prose-strong:font-medium prose-a:font-normal prose-a:underline-offset-4 prose-blockquote:font-normal [&_blockquote_p]:before:content-none [&_blockquote_p]:after:content-none prose-code:font-normal prose-code:before:content-none prose-code:after:content-none prose-table:text-body-sm prose-th:text-label-sm prose-th:uppercase prose-th:text-muted-foreground [&_:not(pre)>code]:rounded-xs [&_:not(pre)>code]:bg-muted [&_:not(pre)>code]:px-1.5 [&_:not(pre)>code]:py-0.5 [&_details]:my-2.5 [&_details]:rounded-md [&_details]:border [&_details]:px-3.5 [&_summary]:cursor-pointer [&_summary]:py-2 [&_summary]:text-label-md [&_summary]:text-muted-foreground [&_summary:hover]:text-foreground',
};

function msgHtml(icon, text) {
  return `<div class="flex h-60 flex-col items-center justify-center gap-3 text-body-sm text-muted-foreground"><div class="text-4xl opacity-35">${icon}</div><div>${text}</div></div>`;
}

// ── Theme: system (default) → light → dark ──
const htmlEl = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const THEMES = {
  system: { icon: '◐', label: 'System', next: 'light' },
  light:  { icon: '○', label: 'Light',  next: 'dark' },
  dark:   { icon: '●', label: 'Dark',   next: 'system' },
};
let theme = THEMES[localStorage.getItem('ar-theme')] ? localStorage.getItem('ar-theme') : 'system';

const themeIcon = themeBtn.querySelector('.hdr-icon');
const themeLabel = themeBtn.querySelector('.hdr-label');

function applyTheme(t) {
  theme = t;
  htmlEl.classList.toggle('dark', t === 'dark' || (t === 'system' && darkQuery.matches));
  themeIcon.textContent = THEMES[t].icon;
  themeLabel.textContent = THEMES[t].label;
  // No stored value means "follow the OS" — the head script reads it the same way.
  if (t === 'system') localStorage.removeItem('ar-theme');
  else localStorage.setItem('ar-theme', t);
}
applyTheme(theme);
themeBtn.onclick = () => applyTheme(THEMES[theme].next);
darkQuery.addEventListener('change', () => { if (theme === 'system') applyTheme('system'); });

// ── Mobile sidebar ──
const sidebar = document.getElementById('sidebar');
const mobToggle = document.getElementById('mob-toggle');
function setSidebarOpen(open) {
  sidebar.classList.toggle('open', open);
  mobToggle.setAttribute('aria-expanded', String(open));
}
mobToggle.onclick = () => setSidebarOpen(!sidebar.classList.contains('open'));

// ── Routing ──
function getHash() {
  const [date, report] = location.hash.slice(1).split('/');
  return /^\d{4}-\d{2}-\d{2}$/.test(date) && report ? { date, report } : null;
}

// ── State ──
let currentKey = null;
let searchIndex = null;
let searchReady = false;
let searchQuery = '';
let searchDebounce = null;

const searchInput = document.getElementById('searchInput');
const searchStatus = document.getElementById('searchStatus');

function setSearchStatus(text) {
  searchStatus.textContent = text || '';
}

function applyDateSearch(query) {
  const needle = query.trim().toLowerCase();
  let hits = 0;

  document.querySelectorAll('.date-group').forEach((grp) => {
    const hdr = grp.querySelector('.date-hdr');
    if (!hdr) return;

    if (!needle || !searchIndex) {
      hdr.classList.remove('search-hit');
      return;
    }

    const text = searchIndex.get(grp.dataset.date) || '';
    const matched = text.includes(needle);
    hdr.classList.toggle('search-hit', matched);
    if (matched) hits += 1;
  });

  if (!needle) {
    setSearchStatus('');
  } else if (!searchReady) {
    setSearchStatus('Building index…');
  } else {
    setSearchStatus(`${hits} ${hits === 1 ? 'day' : 'days'} match`);
  }
}

async function buildSearchIndex(dates) {
  const index = new Map();
  dates.forEach(({ date }) => index.set(date, ''));

  // Flatten into a single task list and drain with a small worker pool so we
  // never flood the browser's connection pool (a fetch storm here was starving
  // the primary content fetch and causing "Failed to fetch" on initial load).
  const tasks = [];
  dates.forEach(({ date, reports }) => {
    reports.forEach((report) => tasks.push({ date, report }));
  });

  const chunks = new Map(dates.map(({ date }) => [date, []]));
  let cursor = 0;
  const worker = async () => {
    while (cursor < tasks.length) {
      const { date, report } = tasks[cursor++];
      try {
        const res = await fetch(`./digests/${date}/${report}.md`);
        if (res.ok) chunks.get(date).push(await res.text());
      } catch {
        /* ignore — missing report just won't be searchable */
      }
    }
  };
  const POOL = 6;
  await Promise.all(Array.from({ length: POOL }, worker));

  chunks.forEach((arr, date) => index.set(date, arr.join('\n').toLowerCase()));
  return index;
}

function initSearch(dates) {
  searchReady = false;
  setSearchStatus('Preparing index…');

  buildSearchIndex(dates).then((index) => {
    searchIndex = index;
    searchReady = true;
    applyDateSearch(searchQuery);
    if (!searchQuery.trim()) setSearchStatus('');
  });
}

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => applyDateSearch(searchQuery), 120);
});

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

async function loadReport(date, report, push = true) {
  const key = `${date}/${report}`;
  if (key === currentKey) return;
  currentKey = key;

  // Retry of the same report (e.g. after a failed load) already has this
  // hash in session history — pushing again would need a second back-press.
  if (push && location.hash !== `#${key}`) history.pushState(null, '', `#${key}`);

  // Sync sidebar
  document.querySelectorAll('.rpt-btn').forEach(b => {
    const active = b.dataset.key === key;
    b.classList.toggle('active', active);
    if (active) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  document.querySelectorAll('.date-hdr').forEach(h => {
    const grp = h.closest('.date-group');
    const hasActive = grp.querySelector('.rpt-btn.active');
    h.classList.toggle('lit', !!hasActive);
  });
  document.querySelectorAll('.month-hdr').forEach(h => {
    const mGrp = h.closest('.month-group');
    const hasActive = mGrp.querySelector('.rpt-btn.active');
    h.classList.toggle('lit', !!hasActive);
  });
  document.querySelectorAll('.date-group').forEach(g => {
    if (g.dataset.date === date) {
      g.classList.add('open');
      // Also open parent month group
      const monthGrp = g.closest('.month-group');
      if (monthGrp) monthGrp.classList.add('open');
    }
  });

  // Close mobile sidebar and reset its inner scroll — a retained scrollTop
  // pushes the toggle row out of the collapsed 48px strip, making the bar
  // look like it vanished (and it can't be clicked to reopen). Only reset
  // when an expanded mobile sidebar is actually being collapsed, so the
  // scroll position of the desktop 300px list is preserved.
  const wasOpen = sidebar.classList.contains('open');
  setSidebarOpen(false);
  if (wasOpen) sidebar.scrollTop = 0;

  const cwrap = document.getElementById('cwrap');
  setContent(msgHtml('⏳', 'Loading…'));
  cwrap.scrollTop = 0;

  try {
    let res;
    // Retry transient failures: network errors and statuses that may recover
    // on their own (5xx, 429). A 4xx like 404 means the report is really
    // missing (manifest/digests drift) — fail immediately instead of
    // stalling the error behind three retries and backoff.
    for (let attempt = 0; ; attempt++) {
      try {
        res = await fetch(`./digests/${date}/${report}.md`);
        if (res.ok || (res.status < 500 && res.status !== 429) || attempt >= 2) break;
      } catch (netErr) {
        if (attempt >= 2) throw netErr;
      }
      await new Promise((r) => setTimeout(r, 300 * (attempt + 1)));
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.text();
    // Drop the response if the user has navigated to another report while
    // this fetch was in flight, so a slow stale reply can't overwrite it.
    if (currentKey !== key) return;
    const safe = renderMarkdown(raw);
    setContent(`<article class="${CLS.md}">${safe}</article>`);
  } catch (e) {
    // The user has already switched to another report — don't overwrite its
    // content with this stale request's error.
    if (currentKey !== key) return;
    // Reset the guard so clicking the same report again retries; otherwise
    // the early-return above turns every further click into a silent no-op
    // and the only way out is loading a different report first.
    currentKey = null;
    setContent(msgHtml('⚠️', `Failed to load: ${e.message}`));
  }
}

function buildDateGroup(date, reports, isFirst) {
  const grp = document.createElement('div');
  grp.className = 'date-group group/date' + (isFirst ? ' open' : '');
  grp.dataset.date = date;

  const hdr = document.createElement('button');
  hdr.type = 'button';
  hdr.className = 'date-hdr ' + CLS.dateHdr;
  // Show only the day part (DD) since month is already in the parent header
  const dayLabel = date.slice(8); // "03" from "2026-04-03"
  const dateText = document.createTextNode(dayLabel + ' ');
  const arrSpan = document.createElement('span');
  arrSpan.className = CLS.dateArr;
  arrSpan.setAttribute('aria-hidden', 'true');
  arrSpan.textContent = '›';
  hdr.appendChild(dateText);
  hdr.appendChild(arrSpan);
  hdr.onclick = () => grp.classList.toggle('open');

  const list = document.createElement('div');
  list.className = CLS.rptList;

  reports.forEach(r => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rpt-btn ' + CLS.rptBtn;
    btn.dataset.key = `${date}/${r}`;
    btn.textContent = LABELS[r] || r;
    btn.onclick = () => loadReport(date, r);
    list.appendChild(btn);
  });

  grp.append(hdr, list);
  return grp;
}

function buildNav(dates) {
  const nav = document.getElementById('nav');

  // Group dates by month (YYYY-MM)
  const months = new Map();
  dates.forEach((entry) => {
    const month = entry.date.slice(0, 7); // "2026-04"
    if (!months.has(month)) months.set(month, []);
    months.get(month).push(entry);
  });

  let isFirstDate = true;
  let isFirstMonth = true;
  months.forEach((entries, month) => {
    const mGrp = document.createElement('div');
    mGrp.className = 'month-group group/month' + (isFirstMonth ? ' open' : '');

    const mHdr = document.createElement('button');
    mHdr.type = 'button';
    mHdr.className = 'month-hdr ' + CLS.monthHdr;
    const mText = document.createTextNode(month + ' ');
    const mArr = document.createElement('span');
    mArr.className = CLS.monthArr;
    mArr.setAttribute('aria-hidden', 'true');
    mArr.textContent = '›';
    mHdr.appendChild(mText);
    mHdr.appendChild(mArr);
    mHdr.onclick = () => mGrp.classList.toggle('open');

    const mBody = document.createElement('div');
    mBody.className = CLS.monthBody;

    entries.forEach(({ date, reports }) => {
      mBody.appendChild(buildDateGroup(date, reports, isFirstDate));
      isFirstDate = false;
    });

    mGrp.append(mHdr, mBody);
    nav.appendChild(mGrp);
    isFirstMonth = false;
  });
}

window.addEventListener('popstate', () => {
  const h = getHash();
  if (h) loadReport(h.date, h.report, false);
});

// ── Init ──
(async () => {
  try {
    const res = await fetch('./manifest.json');
    if (!res.ok) throw new Error('manifest.json not found');
    const { dates } = await res.json();
    if (!dates?.length) throw new Error('manifest is empty');

    buildNav(dates);

    // Load the visible report BEFORE kicking off search indexing. Indexing
    // fetches every report across every date; doing it first would flood the
    // connection pool and cause the primary content fetch to fail on initial
    // load (the "Failed to fetch" seen on external deep-links / refresh).
    const hash = getHash();
    const first = dates[0];
    if (hash && dates.find(d => d.date === hash.date && d.reports.includes(hash.report))) {
      await loadReport(hash.date, hash.report, false);
    } else if (first?.reports?.length) {
      const r0 = first.reports[0];
      history.replaceState(null, '', `#${first.date}/${r0}`);
      await loadReport(first.date, r0, false);
    }

    initSearch(dates);
  } catch (e) {
    document.getElementById('nav').innerHTML =
      '<div class="px-4 py-6 text-center text-body-sm text-muted-foreground">⚠️ ' + e.message + '</div>';
    setContent(msgHtml('📡', 'Could not load manifest.json'));
  }
})();
</script>
</body>
</html>
